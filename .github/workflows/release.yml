name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            voladj.exe
            install.ps1
          generate_release_notes: true
          fail_on_unmatched_files: true
